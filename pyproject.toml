[project]
name = "rgaa-audit-ia"
version = "0.1.0"
description = "Audit d'accessibilité RGAA : règles déterministes + LLM vision, résultats justifiés"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Ne pas reformater les blocs de code des fichiers Markdown
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
